name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Show installed versions
        run: pip list

      - name: Run pytest with coverage
        run: |
          pytest --cov=simweave --cov-report=xml --cov-report=term-missing

      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  base-install:
    # Installs ONLY the declared base dependencies (no extras, no dev tools)
    # into a clean venv. The `test` job installs [dev], which pulls in plotly
    # and friends and so masks missing-dependency import errors.
    name: base install smoke (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist

      - name: Install wheel into clean venv (base deps only)
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/base-venv"
          if [ -x "$RUNNER_TEMP/base-venv/bin/python" ]; then
            PY="$RUNNER_TEMP/base-venv/bin/python"
          else
            PY="$RUNNER_TEMP/base-venv/Scripts/python.exe"
          fi
          echo "BASE_PY=$PY" >> "$GITHUB_ENV"
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install dist/*.whl
          "$PY" -m pip list

      - name: Import + version
        shell: bash
        working-directory: ${{ runner.temp }}
        run: '"$BASE_PY" -c "import simweave; print(simweave.__version__)"'

      - name: Smoke test
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          "$BASE_PY" - <<'EOF'
          import importlib.util
          import simweave as sw
          import simweave.viz

          assert importlib.util.find_spec("plotly") is None, "plotly must be absent"
          assert sw.have_plotly() is False
          from simweave.viz.plots import plot_state_trajectories
          try:
              plot_state_trajectories(object())
          except ImportError as e:
              assert "simweave[viz]" in str(e), e
          else:
              raise SystemExit("plot helper should raise ImportError without plotly")
          print("base-install smoke OK")
          EOF

  lint:
    name: lint + type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.15,<0.16" mypy numpy
          pip install -e .

      - name: ruff (lint)
        run: ruff check src tests

      - name: ruff (format check, advisory)
        # Non-blocking until the canonical formatter has been applied repo-wide.
        # To enforce: run `ruff format src tests` locally, commit, then remove
        # continue-on-error below.
        continue-on-error: true
        run: ruff format --check --diff src tests

      - name: mypy (type check, non-blocking)
        continue-on-error: true
        run: mypy src/simweave

  build:
    name: build wheel + sdist
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build backend
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Check metadata
        run: twine check dist/*

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
